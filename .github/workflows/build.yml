name: Build libinfer (Cross-Platform)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin_dir: build/Release
            ext: dll
            cli: infer_cli.exe
          - os: ubuntu-latest
            name: linux-x64
            bin_dir: build
            ext: so
            cli: infer_cli
          - os: macos-latest
            name: macos-arm64
            bin_dir: build
            ext: dylib
            cli: infer_cli

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # FIX 1: Pin llama.cpp to a stable release tag (b3600) instead of unstable master
    - name: Force Clone Stable llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 --branch b3600 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

    - name: Install CUDA Toolkit
      if: runner.os != 'macOS'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.4.0'

    # FIX 2: Explicitly disable GGML_NATIVE to resolve the dynamic backend conflict
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF

    - name: Build Project
      run: cmake --build build --config Release --parallel 4

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging
        cp ${{ matrix.bin_dir }}/*infer*.${{ matrix.ext }} staging/ 2>/dev/null || true
        cp ${{ matrix.bin_dir }}/*ggml*.${{ matrix.ext }} staging/ 2>/dev/null || true
        cp ${{ matrix.bin_dir }}/${{ matrix.cli }} staging/ 2>/dev/null || true
        cp include/infer.h staging/

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: staging/
