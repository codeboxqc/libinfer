name: Build libinfer (Cross-Platform)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: dll
            cli: infer_cli.exe
          - os: ubuntu-latest
            name: linux-x64
            ext: so
            cli: infer_cli
          - os: macos-latest
            name: macos-arm64
            ext: dylib
            cli: infer_cli

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Force Clone latest llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

    - name: Install CUDA Toolkit
      if: runner.os != 'macOS'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.4.0'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF

    - name: Build Project
      run: cmake --build build --config Release --parallel 4

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging
        find build -name "*.${{ matrix.ext }}" -exec cp {} staging/ \;
        find build -name "${{ matrix.cli }}" -type f -exec cp {} staging/ \;
        cp include/infer.h staging/

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: staging/

  release:
    needs: build 
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: Zip binaries by OS
        shell: bash
        run: |
          cd all-binaries
          # Loop through each OS folder, go inside, zip the files, and place the zip outside
          for dir in */; do
            dir_name="${dir%/}"
            cd "$dir_name"
            zip -r "../${dir_name}.zip" ./*
            cd ..
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest" 
          name: "Latest Development Build"
          prerelease: true
          # Only attach the newly created .zip files
          files: all-binaries/*.zip
