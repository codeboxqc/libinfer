name: Build libinfer (Cross-Platform)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 1. CRITICAL: Give the workflow permission to create releases
permissions:
  contents: write 

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: dll
            cli: infer_cli.exe
          - os: ubuntu-latest
            name: linux-x64
            ext: so
            cli: infer_cli
          - os: macos-latest
            name: macos-arm64
            ext: dylib
            cli: infer_cli

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Force Clone latest llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

    - name: Install CUDA Toolkit
      if: runner.os != 'macOS'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.4.0'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF

    - name: Build Project
      run: cmake --build build --config Release --parallel 4

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging
        
        # Recursively search the entire build tree and gather all shared libraries
        find build -name "*.${{ matrix.ext }}" -exec cp {} staging/ \;
        
        # Find and copy the CLI test executable
        find build -name "${{ matrix.cli }}" -type f -exec cp {} staging/ \;
        
        # Copy the pure C-API header
        cp include/infer.h staging/

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: staging/

  # 2. NEW DEDICATED RELEASE JOB
  release:
    needs: build # This ensures it waits for Windows, Mac, and Linux to finish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only create releases when pushing to main

    steps:
      # Step A: Download all 3 artifacts from the build job above
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      # Step B: Automatically create/update a release using the downloaded files
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest" # Updates the "latest" tag automatically
          name: "Latest Development Build"
          prerelease: true
          # Grabs every file downloaded from the artifacts and uploads them to the release page
          files: all-binaries/**/*
