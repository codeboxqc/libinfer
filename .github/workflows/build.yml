name: Build libinfer (Cross-Platform x64 + ARM64, CUDA + Vulkan)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin windows-2022 & ubuntu-24.04 so CUDA 12.4 compiles cleanly
          # (ubuntu-latest moved to Ubuntu 26.04 which replaced libxml2.so.2 with libxml2.so.16 and bumped GCC/glibc)
          - os: windows-2022
            name: windows-x64
            arch: x64
            ext: dll
            exe_ext: .exe
            use_cuda: true
            use_vulkan: true
            use_clang_cl: false
            cpu_all_variants: false
          - os: windows-11-arm
            name: windows-arm64
            arch: arm64
            ext: dll
            exe_ext: .exe
            use_cuda: false
            use_vulkan: true
            use_clang_cl: true
            cpu_all_variants: false
          - os: ubuntu-24.04
            name: linux-x64
            arch: x64
            ext: so
            exe_ext: ""
            use_cuda: true
            use_vulkan: true
            use_clang_cl: false
            cpu_all_variants: false
          - os: ubuntu-24.04-arm
            name: linux-arm64
            arch: arm64
            ext: so
            exe_ext: ""
            use_cuda: false
            use_vulkan: true
            use_clang_cl: false
            cpu_all_variants: true
          - os: macos-latest
            name: macos-arm64
            arch: arm64
            ext: dylib
            exe_ext: ""
            use_cuda: false
            use_vulkan: false
            use_clang_cl: false
            cpu_all_variants: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Force Clone latest llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

    - name: Ensure Linux Build Dependencies
      if: runner.os == 'Linux' && matrix.arch != 'arm64'
      run: |
        sudo apt-get update
        PKGS="ninja-build zip"
        if [ "${{ matrix.use_cuda }}" = "true" ]; then
          PKGS="$PKGS libxml2"
        fi
        sudo apt-get install -y $PKGS

    - name: Ensure Zip on Linux ARM64 Host
      if: runner.os == 'Linux' && matrix.arch == 'arm64'
      run: |
        if ! command -v zip >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zip
        fi

    - name: Ensure macOS Build Dependencies
      if: runner.os == 'macOS'
      run: |
        if ! command -v ninja >/dev/null 2>&1; then
          brew install ninja
        fi

    - name: Install CUDA Toolkit
      if: matrix.use_cuda
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.4.0'

    - name: Install Vulkan SDK
      if: matrix.use_vulkan && !(runner.os == 'Linux' && matrix.arch == 'arm64')
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        install_runtime: ${{ runner.os == 'Windows' }}
        cache: true

    - name: Ensure Ninja on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
          choco install -y ninja
        }

    - name: Setup MSVC Developer Command Prompt (Windows Only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $extraFlags = @()
        if ("${{ matrix.use_clang_cl }}" -eq "true") {
          # llama.cpp requires Clang/LLVM (clang-cl) on Windows ARM64 for ARM NEON/intrinsics support.
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\ARM64\bin",
              "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\ARM64\bin"
            )
            foreach ($d in $candidates) {
              if (Test-Path (Join-Path $d "clang-cl.exe")) {
                $env:PATH = "$d;$env:PATH"
                Add-Content -Path $env:GITHUB_PATH -Value $d
                break
              }
            }
          }
          clang-cl --version
          $extraFlags += @(
            "-DCMAKE_C_COMPILER=clang-cl",
            "-DCMAKE_CXX_COMPILER=clang-cl",
            "-DCMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc",
            "-DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc",
            "-DGGML_OPENMP=OFF"
          )
          if (Get-Command lld-link -ErrorAction SilentlyContinue) {
            $extraFlags += "-DCMAKE_LINKER=lld-link"
          }
        }
        if ("${{ matrix.use_cuda }}" -eq "true") {
          $extraFlags += @("-DGGML_CUDA=ON", "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89")
        }
        if ("${{ matrix.use_vulkan }}" -eq "true") {
          $extraFlags += "-DGGML_VULKAN=ON"
        }
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF @extraFlags

    - name: Configure & Build in Ubuntu 22.04 Container (Linux ARM64 - GLIBC 2.35 compatible)
      if: runner.os == 'Linux' && matrix.arch == 'arm64'
      shell: bash
      run: |
        # Build inside ubuntu:22.04 on the ubuntu-24.04-arm runner so binaries link against
        # GLIBC 2.35 + GLIBCXX 3.4.30 (compatible with Orange Pi 5/6 Ubuntu 22.04, Debian 12, and Ubuntu 24.04+)
        # without depending on the deprecated ubuntu-22.04-arm GitHub runner.
        docker run --rm \
          -v "$PWD:/work" \
          -w /work \
          -e HOST_UID="$(id -u)" \
          -e HOST_GID="$(id -g)" \
          -e USE_VULKAN="${{ matrix.use_vulkan }}" \
          -e CPU_ALL_VARIANTS="${{ matrix.cpu_all_variants }}" \
          ubuntu:22.04 bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build git curl wget ca-certificates gnupg xz-utils pkg-config binutils
            git config --global --add safe.directory "*"

            # Install Clang 18 from apt.llvm.org for Jammy (supports ARMv8.0..ARMv9.2+SME while linking Ubuntu 22.04 glibc/libstdc++)
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" > /etc/apt/sources.list.d/llvm.list
            apt-get update
            apt-get install -y --no-install-recommends clang-18

            export CC=clang-18
            export CXX=clang++-18
            clang-18 --version

            EXTRA_FLAGS=(-DGGML_OPENMP=OFF)
            if [ "$CPU_ALL_VARIANTS" = "true" ]; then
              EXTRA_FLAGS+=(-DGGML_CPU_ALL_VARIANTS=ON)
            fi

            if [ "$USE_VULKAN" = "true" ]; then
              mkdir -p /opt/vulkan
              curl -fsSL "https://github.com/jakoch/vulkan-sdk-arm/releases/download/1.4.357.1/vulkansdk-ubuntu-22.04-arm-1.4.357.1.tar.xz" \
                | tar -xJ -C /opt/vulkan
              GLSLC_BIN="$(find /opt/vulkan -name glslc -type f | head -n 1)"
              VULKAN_SDK="$(dirname "$(dirname "$GLSLC_BIN")")"
              VULKAN_LIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 \( -name "libvulkan.so" -o -name "libvulkan.so.1" \) | head -n 1)"
              export VULKAN_SDK
              export PATH="$VULKAN_SDK/bin:$PATH"
              export LD_LIBRARY_PATH="$VULKAN_SDK/lib:${LD_LIBRARY_PATH:-}"
              export PKG_CONFIG_PATH="$VULKAN_SDK/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
              echo "Using VULKAN_SDK=$VULKAN_SDK (lib=$VULKAN_LIB)"
              "$GLSLC_BIN" --version
              EXTRA_FLAGS+=(
                -DGGML_VULKAN=ON
                "-DVulkan_INCLUDE_DIR=$VULKAN_SDK/include"
                "-DVulkan_LIBRARY=$VULKAN_LIB"
                "-DVulkan_GLSLC_EXECUTABLE=$GLSLC_BIN"
              )
            fi

            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF "${EXTRA_FLAGS[@]}"
            cmake --build build --config Release

            echo "=== Required GLIBC / GLIBCXX versions (libinfer.so) ==="
            objdump -T build/libinfer.so | grep -oE "GLIBC_[0-9.]+|GLIBCXX_[0-9.]+" | sort -uV || true
            chown -R "$HOST_UID:$HOST_GID" build
          '

    - name: Configure CMake (Linux x64 & macOS)
      if: runner.os != 'Windows' && !(runner.os == 'Linux' && matrix.arch == 'arm64')
      shell: bash
      run: |
        EXTRA_FLAGS=()
        if [ "${{ matrix.cpu_all_variants }}" = "true" ]; then
          EXTRA_FLAGS+=(-DGGML_CPU_ALL_VARIANTS=ON)
        fi
        if [ "${{ matrix.use_cuda }}" = "true" ]; then
          EXTRA_FLAGS+=(-DGGML_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=75;80;86;89")
          if [ "${{ runner.os }}" = "Linux" ] && command -v g++-13 >/dev/null 2>&1; then
            export CC=gcc-13
            export CXX=g++-13
            EXTRA_FLAGS+=("-DCMAKE_CUDA_HOST_COMPILER=$(command -v g++-13)")
          fi
        fi
        if [ "${{ matrix.use_vulkan }}" = "true" ]; then
          EXTRA_FLAGS+=(-DGGML_VULKAN=ON)
        fi
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"}

    - name: Build Project
      if: !(runner.os == 'Linux' && matrix.arch == 'arm64')
      run: cmake --build build --config Release

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging

        # 1. Copy root dynamic libraries (infer, llama, ggml, ggml-base, ggml-cpu*, ggml-metal) and EXEs
        if [ "${{ runner.os }}" = "Linux" ]; then
          find build \( -type f -o -type l \) ! -path "*/CMakeFiles/*" \
            \( -name "*.so" -o -name "*.so.*" \) \
            ! -name "*ggml-cuda*" ! -name "*ggml-vulkan*" ! -name "*ggml-opencl*" \
            -exec cp -a {} staging/ \;
        else
          find build \( -type f -o -type l \) ! -path "*/CMakeFiles/*" \
            -name "*.${{ matrix.ext }}" \
            ! -name "*ggml-cuda*" ! -name "*ggml-vulkan*" ! -name "*ggml-opencl*" \
            -exec cp -a {} staging/ \;
          if [ "${{ runner.os }}" = "macOS" ]; then
            find build -type f ! -path "*/CMakeFiles/*" -name "libggml-*.so" -exec cp {} staging/ \;
          fi
        fi
        find build -maxdepth 2 -type f -name "*.lib" -exec cp {} staging/ \;
        find build -maxdepth 2 -type f -name "infer_cli${{ matrix.exe_ext }}" -exec cp {} staging/ \;
        find build -maxdepth 2 -type f -name "infer_orange_pi${{ matrix.exe_ext }}" -exec cp {} staging/ \;
        cp include/infer.h staging/ 2>/dev/null || true

        # 2. Copy CUDA backend dynamic library and Windows CUDA runtimes into cuda/
        if [ "${{ matrix.use_cuda }}" = "true" ]; then
          mkdir -p staging/cuda
          if [ "${{ runner.os }}" = "Linux" ]; then
            find build \( -type f -o -type l \) ! -path "*/CMakeFiles/*" \
              \( -name "*ggml-cuda*.so" -o -name "*ggml-cuda*.so.*" \) \
              -exec cp -a {} staging/cuda/ \;
          else
            find build -type f ! -path "*/CMakeFiles/*" -name "*ggml-cuda*.${{ matrix.ext }}" -exec cp {} staging/cuda/ \;
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            CUDA_BIN="$CUDA_PATH/bin"
            cp "$CUDA_BIN"/cudart64_*.dll staging/cuda/ || true
            cp "$CUDA_BIN"/cublas64_*.dll staging/cuda/ || true
            cp "$CUDA_BIN"/cublasLt64_*.dll staging/cuda/ || true
          fi
        fi

        # 3. Copy Vulkan backend dynamic library into vulkan/
        if [ "${{ matrix.use_vulkan }}" = "true" ]; then
          mkdir -p staging/vulkan
          if [ "${{ runner.os }}" = "Linux" ]; then
            find build \( -type f -o -type l \) ! -path "*/CMakeFiles/*" \
              \( -name "*ggml-vulkan*.so" -o -name "*ggml-vulkan*.so.*" \) \
              -exec cp -a {} staging/vulkan/ \;
          else
            find build -type f ! -path "*/CMakeFiles/*" -name "*ggml-vulkan*.${{ matrix.ext }}" -exec cp {} staging/vulkan/ \;
          fi
        fi

        echo "=== Staged files ==="
        find staging -maxdepth 2 | sort

    - name: Package Zip
      shell: bash
      run: |
        cd staging
        if [ "${{ runner.os }}" = "Windows" ]; then
          if command -v 7z >/dev/null 2>&1; then
            7z a ../libinfer-${{ matrix.name }}.zip *
          elif [ -x "/c/Program Files/7-Zip/7z.exe" ]; then
            "/c/Program Files/7-Zip/7z.exe" a ../libinfer-${{ matrix.name }}.zip *
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path * -DestinationPath '../libinfer-${{ matrix.name }}.zip' -Force"
          fi
        else
          zip -ry ../libinfer-${{ matrix.name }}.zip *
        fi

    - name: Upload Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: libinfer-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
    - name: Download all zipped artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        merge-multiple: true

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        files: all-binaries/*.zip
