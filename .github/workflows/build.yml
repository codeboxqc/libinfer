name: Build libinfer (Cross-Platform)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            ext: dll
            cli: infer_cli.exe
            use_vulkan: true
          - os: ubuntu-latest
            name: linux-x64
            ext: so
            cli: infer_cli
            use_vulkan: true
          - os: macos-latest
            name: macos-arm64
            ext: dylib
            cli: infer_cli
            use_vulkan: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Force Clone latest llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux' && matrix.use_vulkan
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev vulkan-tools glslc

    - name: Install Vulkan SDK (Windows Direct from LunarG)
      if: runner.os == 'Windows' && matrix.use_vulkan
      shell: pwsh
      run: |
        $VULKAN_VER = "1.3.296.0"
        $INSTALL_DIR = "C:\VulkanSDK\$VULKAN_VER"
        $URL = "https://sdk.lunarg.com/sdk/download/$VULKAN_VER/windows/VulkanSDK-$VULKAN_VER-Installer.exe?Human=true"
        
        Write-Host "Downloading LunarG Vulkan SDK $VULKAN_VER..."
        curl.exe -L -s -o vulkan_sdk.exe "$URL"
        
        Write-Host "Installing Vulkan SDK silently..."
        Start-Process -FilePath ".\vulkan_sdk.exe" -ArgumentList "--root `"$INSTALL_DIR`" --accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow
        
        echo "VULKAN_SDK=$INSTALL_DIR" \vert{} Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$INSTALL_DIR\Bin" \vert{} Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Setup MSVC Developer Command Prompt (Windows Only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ "${{ matrix.use_vulkan }}" = "true" ]; then
          EXTRA_FLAGS="-DGGML_VULKAN=ON"
        fi
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF $EXTRA_FLAGS

    - name: Build Project
      run: cmake --build build --config Release

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging
        
        # 1. Gather all compiled shared libraries (dll, so, dylib)
        find build -name "*.${{ matrix.ext }}" -exec cp {} staging/ \;
        
        # 2. Gather all compiled static link libraries (.lib files for Windows MSVC)
        find build -name "*.lib" -exec cp {} staging/ \;
        
        # 3. Gather the CLI executable
        find build -name "${{ matrix.cli }}" -type f -exec cp {} staging/ \;
        
        # 4. Gather the C header
        cp include/infer.h staging/

    - name: Package Zip
      shell: bash
      run: |
        cd staging
        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a ../libinfer-${{ matrix.name }}.zip *
        else
          zip -r ../libinfer-${{ matrix.name }}.zip *
        fi

    - name: Upload Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: libinfer-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Download all zipped artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        merge-multiple: true

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        files: all-binaries/*.zip
