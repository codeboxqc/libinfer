name: Build libinfer for All Platforms

on:
  push:
    branches: [ "main" ]

jobs:
  build-cross-platform:
    strategy:
      matrix:
        # This tells GitHub to spin up 3 separate servers at the same time
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      # Notice the -G "Visual Studio" is REMOVED. 
      # This allows CMake to auto-detect the correct compiler for the OS.
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release --parallel 4

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.os }}-binaries
        # Uploads the entire build folder containing the .dll, .so, or .dylib
        path: build/
