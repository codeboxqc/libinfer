name: Build libinfer (Cross-Platform)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: dll
            cli: infer_cli.exe
          - os: ubuntu-latest
            name: linux-x64
            ext: so
            cli: infer_cli
          - os: macos-latest
            name: macos-arm64
            ext: dylib
            cli: infer_cli

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Force Clone latest llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

    - name: Install CUDA Toolkit
      if: runner.os != 'macOS'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.4.0'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF

    - name: Build Project
      run: cmake --build build --config Release --parallel 4

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging
        
        # 1. Gather all compiled shared libraries (dll, so, dylib)
        find build -name "*.${{ matrix.ext }}" -exec cp {} staging/ \;
        
        # 2. Gather all compiled static link libraries (.lib files for Windows MSVC)
        find build -name "*.lib" -exec cp {} staging/ \;
        
        # 3. Gather the CLI executable
        find build -name "${{ matrix.cli }}" -type f -exec cp {} staging/ \;
        
        # 4. Gather the C header
        cp include/infer.h staging/

    - name: Package Zip
      shell: bash
      run: |
        cd staging
        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a ../libinfer-${{ matrix.name }}.zip *
        else
          zip -r ../libinfer-${{ matrix.name }}.zip *
        fi

    - name: Upload Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: libinfer-${{ matrix.name }}.zip

  # Dedicated release job prevents matrix collisions
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Download all zipped artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        merge-multiple: true # Flattens the downloads so all 3 zips sit in the same folder

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        files: all-binaries/*.zip
