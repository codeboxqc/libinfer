name: Build libinfer (Cross-Platform Dual CUDA + Vulkan)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
            ext: dll
            cli: infer_cli.exe
            use_cuda: true
            use_vulkan: true
          - os: ubuntu-latest
            name: linux-x64
            ext: so
            cli: infer_cli
            use_cuda: true
            use_vulkan: true
          - os: macos-latest
            name: macos-arm64
            ext: dylib
            cli: infer_cli
            use_cuda: false
            use_vulkan: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Force Clone latest llama.cpp
      shell: bash
      run: |
        rm -rf third_party/llama.cpp
        mkdir -p third_party
        git clone --depth 1 https://github.com/ggerganov/llama.cpp.git third_party/llama.cpp

    - name: Install CUDA Toolkit
      if: matrix.use_cuda
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.4.0'

    - name: Install Vulkan SDK
      if: matrix.use_vulkan
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        install_runtime: true
        cache: true

    - name: Setup Ninja (For faster, reliable builds)
      uses: seanmiddleditch/gha-setup-ninja@v4

    - name: Setup MSVC Developer Command Prompt (Windows Only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ "${{ matrix.use_cuda }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75;80;86;89"
        fi
        if [ "${{ matrix.use_vulkan }}" = "true" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS -DGGML_VULKAN=ON"
        fi
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF $EXTRA_FLAGS

    - name: Build Project
      run: cmake --build build --config Release

    - name: Stage Artifacts
      shell: bash
      run: |
        mkdir -p staging/cuda
        mkdir -p staging/vulkan

        # 1. Gather main shared core libraries & executables into staging root
        find build -maxdepth 2 -name "*infer*.${{ matrix.ext }}" -exec cp {} staging/ \;
        find build -maxdepth 2 -name "*.lib" -exec cp {} staging/ \;
        find build -maxdepth 2 -name "${{ matrix.cli }}" -type f -exec cp {} staging/ \;
        cp include/infer.h staging/ 2>/dev/null || true

        # 2. Move CPU backend to staging root
        find build -name "*ggml-cpu*" -exec cp {} staging/ \;

        # 3. Copy CUDA backend and runtime libraries into cuda/
        if [ "${{ matrix.use_cuda }}" = "true" ]; then
          find build -name "*ggml-cuda*" -exec cp {} staging/cuda/ \;
          if [ "${{ runner.os }}" = "Windows" ]; then
            CUDA_BIN="$CUDA_PATH/bin"
            cp "$CUDA_BIN"/cudart64_*.dll staging/cuda/ || true
            cp "$CUDA_BIN"/cublas64_*.dll staging/cuda/ || true
            cp "$CUDA_BIN"/cublasLt64_*.dll staging/cuda/ || true
          fi
        fi

        # 4. Copy Vulkan backend libraries into vulkan/
        if [ "${{ matrix.use_vulkan }}" = "true" ]; then
          find build -name "*ggml-vulkan*" -exec cp {} staging/vulkan/ \;
        fi

    - name: Package Zip
      shell: bash
      run: |
        cd staging
        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a ../libinfer-${{ matrix.name }}.zip *
        else
          zip -r ../libinfer-${{ matrix.name }}.zip *
        fi

    - name: Upload Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-${{ matrix.name }}
        path: libinfer-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Download all zipped artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        merge-multiple: true

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        files: all-binaries/*.zip
