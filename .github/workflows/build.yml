name: Build libinfer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to click a "Run workflow" button in GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code and Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive # CRITICAL: Without this, third_party/llama.cpp will be empty

    - name: Install NVIDIA CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.36
      id: cuda-toolkit
      with:
        cuda: '12.4.0' # Provides nvcc for compiling the ggml-cuda module

    - name: Configure CMake
      run: >
        cmake -B build 
        -G "Visual Studio 18 2026"
        -A x64 
        -DCMAKE_BUILD_TYPE=Release

    - name: Compile Release Binaries
      run: cmake --build build --config Release --parallel 4

    - name: Upload Binaries as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libinfer-windows-x64
        path: |
          build/Release/infer.dll
          build/Release/infer_core.lib
          build/Release/ggml-cuda.dll
          build/Release/infer_cli.exe
          include/infer.h
